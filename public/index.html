<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniNest | Zero Brokerage Student Housing & Roommates</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight cursor-pointer" onclick="loadListings()">🏠 UniNest</h1>
            <span class="bg-red-500 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Zero Brokerage</span>
        </div>
    </nav>

    <!-- Hero Search Section -->
    <header class="bg-indigo-900 text-white py-12 px-4 shadow-inner">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl md:text-4xl font-extrabold mb-4">Find Student PGs, Hostels & Roommates</h2>
            <p class="text-indigo-200 mb-8">Verified listings. Direct student connections. No broker fees.</p>
            
            <!-- Filter Bar -->
            <div class="bg-white p-4 rounded-xl shadow-xl flex flex-col md:flex-row gap-3 text-gray-800">
                <select id="filterType" class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Categories</option>
                    <option value="pg">PG</option>
                    <option value="hostel">Hostel</option>
                    <option value="roommate">Roommate Needed</option>
                </select>
                <input id="filterLocation" type="text" placeholder="Enter Locality (e.g. North Campus)" class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input id="filterPrice" type="number" placeholder="Max Budget (₹)" class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="loadListings()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">Search</button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-10 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Listings Column -->
        <section class="lg:col-span-2">
            <h3 class="text-xl font-bold text-gray-800 mb-6 flex justify-between items-center">
                Available Spaces <span id="matchCount" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-normal">0 properties</span>
            </h3>
            <div id="listingsContainer" class="space-y-6">
                <!-- Dynamic cards render here -->
            </div>
        </section>

        <!-- Post Ad Form Column -->
        <section class="bg-white p-6 rounded-xl shadow-md h-fit border border-gray-100">
            <h3 class="text-xl font-bold text-gray-800 mb-4">List Your Room / Requirement</h3>
            <form id="listingForm" onsubmit="createListing(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Listing Type</label>
                    <select id="formType" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="pg">Paying Guest (PG)</option>
                        <option value="hostel">Hostel Room</option>
                        <option value="roommate">Roommate Space</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
                    <input type="text" id="formTitle" required placeholder="e.g. Single room available for female student" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Locality / University Area</label>
                    <input type="text" id="formLocation" required placeholder="e.g. North Campus" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Monthly Rent (₹)</label>
                        <input type="number" id="formPrice" required placeholder="Rent" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Sharing Type</label>
                        <select id="formSharing" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Single">Single</option>
                            <option value="Double">Double Sharing</option>
                            <option value="Triple">Triple Sharing</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Amenities (Comma separated)</label>
                    <input type="text" id="formAmenities" placeholder="WiFi, AC, Food, Gym" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contact Number / WhatsApp</label>
                    <input type="tel" id="formContact" required placeholder="10-digit mobile number" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg shadow hover:bg-emerald-700 transition duration-200">🚀 Post Property Instantly</button>
            </form>
        </section>
    </main>

    <!-- Runtime JavaScript Logic -->
    <script>
        async function loadListings() {
            const type = document.getElementById('filterType').value;
            const location = document.getElementById('filterLocation').value;
            const maxPrice = document.getElementById('filterPrice').value;

            const url = `/api/listings?type=${type}&location=${encodeURIComponent(location)}&maxPrice=${maxPrice}`;
            
            try {
                const response = await fetch(url);
                const listings = await response.json();
                renderListings(listings);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function renderListings(items) {
            const container = document.getElementById('listingsContainer');
            document.getElementById('matchCount').innerText = `${items.length} spaces matched`;
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl shadow border text-center text-gray-500">
                        🔍 No direct-owner listings match your criteria. Try widening your search!
                    </div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-lg transition">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">${item.type}</span>
                            <span class="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-amber-100 text-amber-800">${item.sharing} Space</span>
                        </div>
                        <h4 class="text-xl font-bold text-gray-900">${item.title}</h4>
                        <p class="text-gray-600 font-medium mt-0.5">📍 ${item.location}</p>
                        <div class="flex flex-wrap gap-1.5 mt-3">
                            ${item.amenities.map(a => `<span class="bg-gray-100 text-gray-600 text-xs px-2.5 py-1 rounded-full font-medium">✔️ ${a}</span>`).join('')}
                        </div>
                    </div>
                    <div class="text-left md:text-right w-full md:w-auto border-t md:border-t-0 pt-4 md:pt-0 border-gray-100 flex md:flex-col justify-between items-center md:items-end gap-2">
                        <div>
                            <p class="text-2xl font-black text-gray-900">₹${item.price.toLocaleString('en-IN')}</p>
                            <p class="text-xs text-gray-400 font-medium">per month (No Brokerage)</p>
                        </div>
                        <button onclick="alert('Owner Contact: ${item.contact}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold shadow text-sm transition">Get Owner Details</button>
                    </div>
                </div>
            `).join('');
        }

        async function createListing(event) {
            event.preventDefault();
            const data = {
                type: document.getElementById('formType').value,
